<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1 mt-3 ms-3 me-3">
    <!-- Breadcrumb à gauche -->
    <nav class="page-breadcrumb cursor-pointer">
        <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openAddPoste(SearchPosteModal)">
            <i class="feather icon-search"></i>
        </button>
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item active"></li>
        </ol>
    </nav>

    <!-- Boutons à droite -->
    <div class="d-flex justify-content-end align-items-center gap-2">
        <button type="button" class="btn btn-primary btn-icon-text d-flex gap-2" (click)="openAddPoste(addPosteModal)">
            Nouveau poste <i class="feather icon-plus-circle"></i> 
        </button>
    </div>

</div>

<div class="card mt-4">
    <div class="card-body p-0">
        <section class="table-container" tabindex="0">
            <table mat-table [dataSource]="dataSource?.payload" class="mat-table">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:50px;">
                        name </th>
                    <td mat-cell *matCellDef="let agent" class="text-center"> {{agent?.name}} </td>
                </ng-container>


                <ng-container matColumnDef="service">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:50px;">
                        service </th>
                    <td mat-cell *matCellDef="let agent" class="text-center"> {{agent?.service}} </td>
                </ng-container>

                
                
                <ng-container matColumnDef="lieu">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:50px;">
                        lieu </th>
                    <td mat-cell *matCellDef="let agent" class="text-center"> {{agent?.lieu}} </td>
                </ng-container>

                
                <ng-container matColumnDef="occupation">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:50px;">
                        Etat </th>
                    <td mat-cell *matCellDef="let agent" class="text-center"> {{agent?.occupation.name}} </td>
                </ng-container>

                
                <ng-container matColumnDef="actions" stickyEnd>
                    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:0px;">
                        Actions </th>
                    <td mat-cell *matCellDef="let poste">
                        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="openEditPoste(EditPosteModal, poste)">
                                <mat-icon>edit</mat-icon>
                                <span>Modifier</span>
                            </button>
                            <button mat-menu-item (click)="deletePoste(poste.id)">
                                <mat-icon>delete</mat-icon>
                                <span>Supprimer</span>
                            </button>
                        </mat-menu>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
                <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
            </table>
            <span *ngIf="dataSource?.payload?.length == 0" class="paginate text-danger mt-4">Les critères de recherche
                tels qu'énoncés ne correspondent à aucun contrat</span>

            <div class="paginate">
                <ngb-pagination [collectionSize]="dataSource?.metadata?.totalElements" [page]="pageOptions.page+1"
                    [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm"
                    [rotate]="true" [ellipses]="true" [boundaryLinks]="true">
                </ngb-pagination>
            </div>
        </section>
      
    </div>
</div>

<!-- search poste -->
<ng-template #SearchPosteModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Recherche poste</h5>
        <button type="button" class="btn-close"  (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-add-poste-agent (search)="doSearch($event)" [isSearch]="true" (submit)="close()"></app-add-poste-agent>
    </div>
</ng-template>
<!-- search poste -->

<!--Add poste-->
<ng-template #addPosteModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Ajout d'un poste</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-add-poste-agent [isSearch]="false" (submit)="close()" [agentId]=agentId></app-add-poste-agent>
    </div>
</ng-template>
<!--End Add poste-->

<!--Edit poste-->
<ng-template #EditPosteModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modification d'un poste</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-edit-poste-agent [agentId]=agentId (submit)="close()"[posteToUpdate]="posteToUpdate"></app-edit-poste-agent>
    </div> 
</ng-template>
<!--End Edit poste-->
