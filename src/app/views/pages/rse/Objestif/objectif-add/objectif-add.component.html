<!-- ✅ FORMULAIRE RECHERCHE -->
<form [formGroup]="objectifForm" (ngSubmit)="onSearch()" *ngIf="isSearch">
 

  <!-- Type Objectif -->
  <div class="mb-3">
    <label>Type Objectif</label>
    <select formControlName="typeObjectif" class="form-select">
      <option value="">-- Sélectionner --</option>
      <option value="ENVIRONNEMENT">Environnement</option>
      <option value="CURRENT">Current</option>
      <option value="AFTER">After</option>
    </select>
  </div>

  <!-- Date Début -->
  <div class="mb-3">
    <label>Date Début</label>
    <input formControlName="dateDebut" type="date" class="form-control">
  </div>

  <!-- Date Fin -->
  <div class="mb-3">
    <label>Date Fin</label>
    <input formControlName="dateFin" type="date" class="form-control">
  </div>

  <button type="submit" class="btn btn-primary">Rechercher</button>
</form>
